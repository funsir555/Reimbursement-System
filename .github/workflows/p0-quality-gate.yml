name: FinEx quality gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets
        shell: pwsh
        run: ./scripts/check-tracked-secrets.ps1
      - name: Validate changed text encoding
        shell: pwsh
        run: ./scripts/check-text-encoding.ps1
      - name: Check documented technology versions
        shell: pwsh
        run: ./scripts/check-architecture-drift.ps1
      - name: Prevent new or growing oversized production files
        shell: pwsh
        run: ./scripts/check-large-files.ps1
      - name: Check performance report parser
        shell: pwsh
        run: ./scripts/measure-http-performance.ps1 -LogPath ./scripts/tests/http-performance.sample.txt -MinSamples 3

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests, dependency rules and coverage baseline
        working-directory: backend
        run: mvn -pl auth-service -am verify

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json
      - name: Install dependencies
        working-directory: frontend/admin-web
        run: npm ci
      - name: Run unit tests
        working-directory: frontend/admin-web
        run: npm run test:unit -- --reporter=dot
      - name: Run type check
        working-directory: frontend/admin-web
        run: npm run type-check
      - name: Build frontend
        working-directory: frontend/admin-web
        run: npm run build
